spring:
  application:
    name: commutemate-platform-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/commutemate}
    username: ${DATABASE_USER:commutemate}
    password: ${DATABASE_PASSWORD:commutemate}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
commutemate:
  security:
    dev-headers-enabled: ${DEV_HEADERS_ENABLED:true}
    bootstrap-token: ${PLATFORM_BOOTSTRAP_TOKEN:local-bootstrap-only}
